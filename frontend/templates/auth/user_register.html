{% extends 'user_base.html' %}
{% block content %}
<section class="reader-auth panel">
  <span class="page-kicker">TÀI KHOẢN ĐỘC GIẢ</span>
  <h1>Đăng ký</h1>
  <form method="post" class="form-stack">
    <label>
      Họ và tên
      <input name="name" required>
    </label>
    <label>
      Tên đăng nhập
      <input name="username" minlength="3" required>
    </label>
    <label>
      Mật khẩu (ít nhất 8 ký tự)
      <input type="password" name="password" minlength="8" required>
    </label>
    <label>
      Email
      <input name="email" type="email">
    </label>
    <label>
      Số điện thoại
      <input name="phone">
    </label>
    <button>Tạo tài khoản</button>
  </form>
  <p><a href="{{ url_for('user_login') }}">Đã có tài khoản? Đăng nhập</a></p>
</section>
{% endblock %}
