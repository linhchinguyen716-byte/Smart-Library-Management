{% extends 'user_base.html' %}
{% block content %}
<section class="reader-auth panel">
  <div class="page-breadcrumb">ĐĂNG KÝ HỒ SƠ MỚI</div>
  <h1 style="margin-bottom: 8px;">Tạo tài khoản độc giả</h1>
  <p class="muted">Đăng ký để có thể chủ động tra cứu và gửi yêu cầu đặt mượn sách trực tuyến.</p>
  <form method="post" class="form-stack" style="margin-top: 18px;">
    <label>
      Họ và tên
      <input name="name" required placeholder="Ví dụ: Nguyễn Văn A">
    </label>
    <label>
      Tên đăng nhập (tối thiểu 3 ký tự)
      <input name="username" minlength="3" required placeholder="nguyenvana">
    </label>
    <label>
      Mật khẩu (tối thiểu 8 ký tự)
      <input type="password" name="password" minlength="8" required placeholder="••••••••">
    </label>
    <label>
      Địa chỉ Email
      <input name="email" type="email" placeholder="email@domain.com">
    </label>
    <label>
      Số điện thoại liên hệ
      <input name="phone" placeholder="09xxxxxxxx">
    </label>
    <button style="margin-top: 6px;">Hoàn tất đăng ký</button>
  </form>
  <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-color); font-size: 13px;">
    <span>Đã có tài khoản? <a href="{{ url_for('user_login') }}" style="color: var(--primary); font-weight: 500;">Đăng nhập ngay →</a></span>
  </div>
</section>
{% endblock %}
