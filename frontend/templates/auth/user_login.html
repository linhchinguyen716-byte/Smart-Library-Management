{% extends 'user_base.html' %}
{% block content %}
<section class="reader-auth panel">
  <div class="page-breadcrumb">CỔNG DÀNH CHO ĐỘC GIẢ</div>
  <h1 style="margin-bottom: 8px;">Đăng nhập độc giả</h1>
  <p class="muted">Tra cứu kho sách, gửi yêu cầu đặt trước và theo dõi lịch sử mượn trả của bạn.</p>
  <form method="post" class="form-stack" style="margin-top: 18px;">
    <label>
      Tên đăng nhập
      <input name="username" required autocomplete="username" placeholder="Nhập tài khoản độc giả">
    </label>
    <label>
      Mật khẩu
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </label>
    <button style="margin-top: 4px;">Đăng nhập</button>
  </form>
  <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border-color); font-size: 13px; display: flex; flex-direction: column; gap: 8px;">
    <span>Chưa có tài khoản độc giả? <a href="{{ url_for('user_register') }}" style="color: var(--primary); font-weight: 500;">Đăng ký tài khoản mới →</a></span>
    <span><a href="{{ url_for('admin_login') }}" style="color: var(--text-muted);">Đăng nhập tài khoản Nhân sự / Quản trị viên</a></span>
  </div>
</section>
{% endblock %}
