{% extends 'base.html' %}{% block content %}<h1>✏️ Sửa thông tin độc giả</h1><form method="post" class="panel formgrid">{% for field,label in [('code','Mã độc giả'),('name','Họ tên'),('dob','Ngày sinh'),('phone','Điện thoại'),('email','Email'),('address','Địa chỉ')] %}<label>{{label}}<input name="{{field}}" value="{{reader[field] or ''}}" {% if field in ['code','name'] %}required{% endif %} {% if field=='dob' %}type="date"{% elif field=='email' %}type="email"{% endif %}></label>{% endfor %}<button>Lưu thay đổi</button><a class="btn" href="{{url_for('readers')}}">Quay lại</a></form>{% endblock %}
