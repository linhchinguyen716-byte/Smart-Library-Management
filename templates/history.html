{% extends 'base.html' %}{% block content %}<h1>📜 Tra cứu lịch sử mượn</h1><form class="panel filters" method="get"><input name="q" value="{{q}}" placeholder="Mã phiếu, mã hoặc tên độc giả"><button>Tìm</button></form><section class="panel"><table><tr><th>Mã phiếu</th><th>Độc giả</th><th>Sách</th><th>Ngày mượn</th><th>Hạn trả</th><th>Ngày trả</th><th>Trạng thái</th></tr>{% for l in loans %}<tr><td>{{l.code}}</td><td>{{l.reader}}</td><td>{{l.books}}</td><td>{{l.borrow_date}}</td><td>{{l.due_date}}</td><td>{{l.return_date or '—'}}</td><td>{{l.status}}</td></tr>{% else %}<tr><td colspan="7">Chưa có dữ liệu</td></tr>{% endfor %}</table></section>{% endblock %}
