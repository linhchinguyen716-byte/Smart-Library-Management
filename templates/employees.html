{% extends 'base.html' %}{% block content %}<h1>👥 Quản lý nhân viên</h1><form method="post" class="panel formgrid"><input name="code" required placeholder="Mã nhân viên"><input name="name" required placeholder="Họ tên"><input name="username" required placeholder="Tài khoản"><input name="password" required type="password" placeholder="Mật khẩu"><select name="role"><option>Nhân viên</option><option>Admin</option></select><button>Thêm nhân viên</button></form><section class="panel"><table><tr><th>Mã</th><th>Tên</th><th>Tài khoản</th><th>Vai trò</th><th>Thao tác</th></tr>{% for e in employees %}<tr><td>{{e.code}}</td><td>{{e.name}}</td><td>{{e.username}}</td><td>{{e.role}}</td><td><form method="post" action="{{url_for('delete_employee',id=e.id)}}" onsubmit="return confirm('Xóa nhân viên?')"><button class="danger">Xóa</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
