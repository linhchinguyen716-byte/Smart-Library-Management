{% extends 'base.html' %}{% block content %}<h1>📚 Quản lý sách</h1><form method="post" class="panel formgrid"><input name="code" placeholder="Mã sách" required><input name="title" placeholder="Tên sách" required><input name="author" placeholder="Tác giả" required><input name="publisher" placeholder="Nhà xuất bản"><input type="number" name="year" placeholder="Năm xuất bản"><select name="category_id"><option value="">Thể loại</option>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input type="number" name="quantity" min="1" value="1" required><button>Thêm sách</button></form><section class="panel"><form method="get" class="filters"><input name="q" placeholder="Tìm tên, mã, tác giả" value="{{q}}"><button>Tìm</button><a class="btn" href="{{url_for('export_csv',kind='books')}}">⬇ Xuất CSV</a></form><table><tr><th>Mã</th><th>Tên</th><th>Tác giả</th><th>Thể loại</th><th>Kho</th><th>Thao tác</th></tr>{% for b in books %}<tr><td>{{b.code}}</td><td>{{b.title}}</td><td>{{b.author}}</td><td>{{b.category or '—'}}</td><td>{{b.available}} / {{b.quantity}}</td><td><div class="actions"><a class="btn" href="{{url_for('edit_book',id=b.id)}}">Sửa</a><form method="post" action="{{url_for('delete_book',id=b.id)}}" onsubmit="return confirm('Xóa sách?')"><button class="danger">Xóa</button></form></div></td></tr>{% else %}<tr><td colspan="6">Chưa có sách</td></tr>{% endfor %}</table></section>{% endblock %}
