{% extends 'base.html' %}{% block content %}<h1>👤 Quản lý độc giả</h1><form method="post" class="panel formgrid"><input name="code" required placeholder="Mã độc giả"><input name="name" required placeholder="Họ tên"><label>Ngày sinh<input type="date" name="dob"></label><input name="phone" placeholder="Số điện thoại"><input name="email" type="email" placeholder="Email"><input name="address" placeholder="Địa chỉ"><button>Thêm độc giả</button></form><section class="panel"><a class="btn" href="{{url_for('export_csv',kind='readers')}}">⬇ Xuất CSV</a><table><tr><th>Mã</th><th>Họ tên</th><th>SĐT</th><th>Email</th><th>Thao tác</th></tr>{% for r in readers %}<tr><td>{{r.code}}</td><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.email}}</td><td><div class="actions"><a class="btn" href="{{url_for('edit_reader',id=r.id)}}">Sửa</a><form method="post" action="{{url_for('delete_reader',id=r.id)}}" onsubmit="return confirm('Xóa độc giả?')"><button class="danger">Xóa</button></form></div></td></tr>{% endfor %}</table></section>{% endblock %}
