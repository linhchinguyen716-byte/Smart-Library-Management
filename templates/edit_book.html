{% extends 'base.html' %}{% block content %}<h1>✏️ Sửa thông tin sách</h1><form method="post" class="panel formgrid"><label>Mã sách<input name="code" value="{{book.code}}" required></label><label>Tên sách<input name="title" value="{{book.title}}" required></label><label>Tác giả<input name="author" value="{{book.author}}" required></label><label>Nhà xuất bản<input name="publisher" value="{{book.publisher or ''}}"></label><label>Năm<input type="number" name="year" value="{{book.year or ''}}"></label><label>Thể loại<select name="category_id"><option value="">Không phân loại</option>{% for c in categories %}<option value="{{c.id}}" {% if book.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Tổng số lượng<input type="number" name="quantity" min="0" value="{{book.quantity}}" required></label><button>Lưu thay đổi</button><a class="btn" href="{{url_for('books')}}">Quay lại</a></form>{% endblock %}
