{% extends 'base.html' %}{% block content %}<h1>🏷️ Quản lý thể loại</h1><form method="post" class="panel filters"><input name="name" placeholder="Tên thể loại" required><input name="description" placeholder="Mô tả"><button>Thêm</button></form><section class="panel"><table><tr><th>Tên</th><th>Mô tả</th><th>Thao tác</th></tr>{% for c in categories %}<tr><td>{{c.name}}</td><td>{{c.description}}</td><td><form method="post" action="{{url_for('delete_category',id=c.id)}}" onsubmit="return confirm('Xóa thể loại?')"><button class="danger">Xóa</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
